{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Staff Account | Attenda Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-bg">
    <div class="auth-card" style="max-width: 520px;">
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem; border-radius: 14px;">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h2 class="fw-bold mb-1" style="font-size: 1.6rem;">Create Staff Account</h2>
            <p class="text-muted small mb-0">Join the administration team to manage institutional records</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show small d-flex align-items-center gap-2" role="alert">
                    <i class="bi bi-info-circle-fill"></i>
                    <div>{{ message }}</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            
            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-secondary">First Name</label>
                    <input type="text" name="first_name" class="form-control" placeholder="e.g. John" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-secondary">Last Name</label>
                    <input type="text" name="last_name" class="form-control" placeholder="e.g. Doe" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted">@</span>
                    <input type="text" name="username" class="form-control border-start-0" placeholder="Choose a username" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Institutional Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control border-start-0" placeholder="staff@institution.edu" required>
                </div>
            </div>

            <div class="row g-2 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-secondary">Password</label>
                    <div class="input-group">
                        <input type="password" name="password" id="regPassword" class="form-control border-end-0" placeholder="Create password" required>
                        <button class="btn btn-light border border-start-0 password-toggle-btn" type="button" data-toggle-password="regPassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-secondary">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" name="confirm_password" id="regConfirmPassword" class="form-control border-end-0" placeholder="Confirm password" required>
                        <button class="btn btn-light border border-start-0 password-toggle-btn" type="button" data-toggle-password="regConfirmPassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
                <span>Create Account &amp; Enter Dashboard</span>
                <i class="bi bi-check2-circle"></i>
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center text-muted small">
            Already have an account? <a href="{% url 'login' %}" class="text-primary fw-semibold text-decoration-none">Sign In</a>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
